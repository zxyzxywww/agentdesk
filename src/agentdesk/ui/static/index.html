<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentDesk — 通用任务型 Agent 工作台</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler.min.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app-shell">

  <!-- 顶部栏 -->
  <header class="app-topbar">
    <div class="brand"><span class="brand-dot"></span>AgentDesk</div>
    <div class="topbar-meta">
      <span id="meta-model" class="badge text-bg-secondary">…</span>
      <span id="meta-search" class="badge text-bg-secondary">…</span>
      <span id="meta-workspace" class="badge text-bg-info" title="工作目录">…</span>
    </div>
    <div class="topbar-cost">累计成本 <b id="total-cost">¥0.0000</b></div>
  </header>

  <div class="app-body">

    <!-- 左栏：会话 -->
    <aside class="col-sessions">
      <div class="panel-head">
        <span class="panel-title">会话</span>
        <button id="btn-new-session" class="btn btn-sm btn-primary">＋ 新建</button>
      </div>
      <div id="session-list" class="session-list"></div>
      <div class="panel-foot">
        <button id="btn-export" class="btn btn-sm btn-outline-secondary w-100" title="导出当前会话为 Markdown 报告">导出报告</button>
      </div>
    </aside>

    <!-- 中栏：对话 -->
    <main class="col-chat">
      <div id="chat" class="chat"></div>
      <div class="composer">
        <div class="composer-row">
          <select id="task-template" class="form-select form-select-sm template-select" title="快捷任务模板">
            <option value="">快捷任务模板…</option>
            <option value="列出工作目录下的所有文件，并概括一下有什么">列出工作目录下的所有文件</option>
            <option value="把工作目录下所有 csv 文件合并为一个 all.csv">合并所有 csv</option>
            <option value="把工作目录里的文件按类型归档到子文件夹">按类型归档文件</option>
            <option value="调研一下 LLM agent 框架的现状，写一份带引用来源的调研笔记">网页调研：LLM agent 框架现状</option>
          </select>
          <span id="task-status" class="text-secondary small ms-auto"></span>
          <button id="btn-stop" class="btn btn-sm btn-danger ms-2" disabled>⏹ 停止</button>
        </div>
        <textarea id="input" rows="3" placeholder="给 AgentDesk 下达任务，例如：把 data 下所有 csv 合并并按列汇总；Enter 发送，Shift+Enter 换行"></textarea>
        <div class="composer-row end">
          <span class="text-secondary small">所有删除/覆盖前会先确认并可撤销</span>
          <button id="btn-send" class="btn btn-primary">发送</button>
        </div>
      </div>
    </main>

    <!-- 右栏：面板 -->
    <aside class="col-panels">
      <ul class="nav nav-tabs panel-tabs" id="panel-tabs">
        <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#tab-run">执行</a></li>
        <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-plan">计划</a></li>
        <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-files">文件</a></li>
        <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-accept">验收</a></li>
        <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-undo">撤销</a></li>
      </ul>
      <div class="tab-content panel-content">
        <div class="tab-pane fade show active" id="tab-run"><div id="run-log" class="run-log"></div></div>
        <div class="tab-pane fade" id="tab-plan"><div id="plan-list" class="plan-list"></div></div>
        <div class="tab-pane fade" id="tab-files">
          <div id="file-upload" class="dropzone">拖拽文件到此处上传，或点击选择</div>
          <input type="file" id="file-input" multiple hidden>
          <div id="file-tree" class="file-tree"></div>
        </div>
        <div class="tab-pane fade" id="tab-accept"><div id="accept-panel"></div></div>
        <div class="tab-pane fade" id="tab-undo"><div id="undo-list" class="undo-list"></div></div>
      </div>
    </aside>

  </div>
</div>

<!-- 确认弹窗 -->
<div class="modal fade" id="confirm-modal" tabindex="-1" role="dialog">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">⚠️ 危险操作需要你确认</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p id="confirm-reason" class="text-danger fw-bold"></p>
        <pre id="confirm-args" class="small bg-body-tertiary p-2 rounded"></pre>
      </div>
      <div class="modal-footer">
        <button id="btn-confirm-no" class="btn btn-secondary">拒绝，换方案</button>
        <button id="btn-confirm-yes" class="btn btn-danger">确认执行</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/js/tabler.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
