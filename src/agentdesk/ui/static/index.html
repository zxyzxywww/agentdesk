<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentDesk — 任务型 Agent 工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app-shell">

  <!-- 顶部栏 -->
  <header class="app-topbar">
    <div class="brand"><span class="brand-dot"></span>AgentDesk<small>Task Agent</small></div>
    <div class="task-heartbeat" id="task-heartbeat"><span class="dot"></span><span id="heartbeat-text">空闲</span></div>
    <div class="topbar-meta">
      <span id="meta-model" class="meta-chip">…</span>
      <span id="meta-search" class="meta-chip">…</span>
      <span id="meta-workspace" class="meta-chip" title="工作目录">…</span>
    </div>
    <div class="topbar-cost">累计成本 <b id="total-cost">¥0.0000</b></div>
  </header>

  <div class="app-body">

    <!-- 左栏：会话 -->
    <aside class="col-sessions">
      <div class="panel-head">
        <span class="panel-title">会话</span>
        <button id="btn-new-session" class="btn btn-sm btn-primary">＋ 新建</button>
      </div>
      <div id="session-list" class="session-list"></div>
      <div class="panel-foot">
        <button id="btn-export" class="btn btn-sm w-100" title="导出当前会话为 Markdown 报告">导出报告 ⤓</button>
      </div>
    </aside>

    <!-- 中栏：对话 -->
    <main class="col-chat">
      <div id="chat" class="chat"></div>
      <div class="composer">
        <div class="composer-row">
          <select id="task-template" class="template-select" title="快捷任务模板">
            <option value="">快捷任务模板…</option>
            <option value="列出工作目录下的所有文件，并概括一下有什么">列出工作目录下的所有文件</option>
            <option value="把工作目录下所有 csv 文件合并为一个 all.csv">合并所有 csv</option>
            <option value="把工作目录里的文件按类型归档到子文件夹">按类型归档文件</option>
            <option value="调研一下 LLM agent 框架的现状，写一份带引用来源的调研笔记">网页调研：LLM agent 框架现状</option>
          </select>
          <span id="task-status" class="text-secondary ms-auto"></span>
          <button id="btn-stop" class="btn btn-sm btn-danger ms-2" disabled>⏹ 停止</button>
        </div>
        <textarea id="input" rows="3" placeholder="下达任务，例如：把工作目录下所有 csv 合并为一个 all.csv · Enter 发送，Shift+Enter 换行"></textarea>
        <div class="composer-row end">
          <span class="text-secondary">删除 / 覆盖前会先确认，执行前自动备份可撤销</span>
          <button id="btn-send" class="btn btn-primary">运行任务 ▶</button>
        </div>
      </div>
    </main>

    <!-- 右栏：面板 -->
    <aside class="col-panels">
      <ul class="panel-tabs" id="panel-tabs">
        <li><a class="nav-link active" data-pane="tab-run">执行</a></li>
        <li><a class="nav-link" data-pane="tab-plan">计划</a></li>
        <li><a class="nav-link" data-pane="tab-files">文件</a></li>
        <li><a class="nav-link" data-pane="tab-accept">验收</a></li>
        <li><a class="nav-link" data-pane="tab-undo">撤销</a></li>
      </ul>
      <div class="panel-content">
        <div class="tab-pane active" id="tab-run"><div id="run-log" class="run-log"></div></div>
        <div class="tab-pane" id="tab-plan"><div id="plan-list" class="plan-list"></div></div>
        <div class="tab-pane" id="tab-files">
          <div id="file-upload" class="dropzone">拖拽文件到此处上传，或点击选择</div>
          <input type="file" id="file-input" multiple hidden>
          <div id="file-tree" class="file-tree"></div>
        </div>
        <div class="tab-pane" id="tab-accept"><div id="accept-panel"></div></div>
        <div class="tab-pane" id="tab-undo"><div id="undo-list" class="undo-list"></div></div>
      </div>
    </aside>

  </div>
</div>

<!-- 确认弹窗 -->
<div class="modal-mask" id="confirm-modal" hidden>
  <div class="modal-box">
    <div class="modal-header">
      <h5 class="modal-title">⚠ 需要你确认</h5>
      <button type="button" class="btn-close" data-dismiss="confirm-modal"></button>
    </div>
    <div class="modal-body">
      <p id="confirm-reason" class="text-danger fw-bold"></p>
      <pre id="confirm-args"></pre>
    </div>
    <div class="modal-footer">
      <button id="btn-confirm-no" class="btn">拒绝，换方案</button>
      <button id="btn-confirm-yes" class="btn btn-danger">确认执行</button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
